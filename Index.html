<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RODGERS MD Pair Site</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">
  <style>
    /* Body & Gradient Background */
    body {
      font-family: 'Orbitron', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      overflow: hidden;
    }

    /* Animated Background Circles */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(0,255,255,0.1);
      animation: float 12s infinite;
      z-index: 0;
    }
    @keyframes float {
      0% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-200px) translateX(100px); }
      100% { transform: translateY(0px) translateX(0px); }
    }

    h1 {
      z-index: 1;
      font-size: 2.5rem;
      text-align: center;
      background: linear-gradient(90deg, #00fff7, #ff00f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 5px #00fff7, 0 0 10px #ff00f7; }
      100% { text-shadow: 0 0 20px #00fff7, 0 0 40px #ff00f7; }
    }

    p { z-index: 1; font-size: 1.1rem; margin-bottom: 20px; }

    input {
      z-index: 1;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      outline: none;
      margin-bottom: 15px;
      width: 250px;
      text-align: center;
    }

    button {
      z-index: 1;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(45deg, #00fff7, #ff00f7);
      color: #fff;
      cursor: pointer;
      transition: 0.3s ease;
      font-weight: bold;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 15px #00fff7, 0 0 25px #ff00f7;
    }

    #pairCode {
      margin-top: 20px;
      font-size: 1.5rem;
      color: #00fff7;
      font-weight: bold;
      text-shadow: 0 0 10px #00fff7;
      animation: pulse 1.5s infinite;
      z-index: 1;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    footer {
      z-index: 1;
      margin-top: 40px;
      text-align: center;
      font-size: 0.9rem;
      color: #aaa;
    }

    footer a {
      color: #00fff7;
      text-decoration: none;
      font-weight: bold;
    }

    footer a:hover {
      text-shadow: 0 0 10px #00fff7;
    }
  </style>
</head>
<body>

  <!-- Animated circles -->
  <div class="circle" style="width:200px; height:200px; top:10%; left:15%;"></div>
  <div class="circle" style="width:150px; height:150px; top:60%; left:70%;"></div>
  <div class="circle" style="width:100px; height:100px; top:30%; left:50%;"></div>

  <h1>🔗 RODGERS MD Pair Site</h1>
  <p>Enter your WhatsApp number to generate a pair code:</p>
  <input type="text" id="number" placeholder="2547xxxxxxx" />
  <br/>
  <button onclick="generatePairCode()">Generate Pair Code</button>
  <h2 id="pairCode"></h2>

  <footer>
    <p>Powered by Rodgers</p>
    <p><a href="https://whatsapp.com/channel/0029VbBR3ib3LdQQlEG3vd1x" target="_blank">Visit our Channel</a></p>
  </footer>

  <script>
    function generatePairCode() {
      const number = document.getElementById('number').value.trim();
      if (!number) { alert('Enter your WhatsApp number!'); return; }

      // Generate 8-character alphanumeric code
      const code = Array.from({length:8}, () => Math.floor(Math.random()*36).toString(36)).join('').toUpperCase();

      document.getElementById('pairCode').textContent = `Your Pair Code: ${code}`;

      // TODO: Connect to backend API to send JSON session automatically
      console.log(`Pair code for ${number}: ${code}`);
    }
  </script>
</body>
</html>
