<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rodgers MD Pair Site</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      text-align: center;
      animation: glow 2s ease-in-out infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff; }
      to { text-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 80px #0ff; }
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1rem;
      width: 90%;
      max-width: 400px;
    }
    input[type="text"] {
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    button {
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 8px;
      border: none;
      background: #0ff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    button:hover {
      transform: scale(1.05);
    }
    #output {
      margin-top: 1rem;
      text-align: center;
      word-break: break-word;
    }
    .action-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }
    footer {
      margin-top: auto;
      padding: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: #0ff;
    }
    a {
      color: #0ff;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>RODGERS MD PAIR SITE</h1>
  
  <form id="pairForm">
    <input type="text" id="numberInput" placeholder="Enter WhatsApp number with country code" required>
    <button type="submit">Generate Pair Code</button>
  </form>

  <div id="output"></div>
  <div class="action-buttons">
    <button id="copyButton" style="display:none;">Copy Pair Code</button>
    <a href="https://wa.me/254755660053" target="_blank">
      <button id="contactOwnerButton" type="button">Contact Owner</button>
    </a>
  </div>

  <footer>
    Powered by Rodgers
  </footer>

  <script>
    const form = document.getElementById("pairForm");
    const numberInput = document.getElementById("numberInput");
    const output = document.getElementById("output");
    const copyButton = document.getElementById("copyButton");

    let latestPairCode = "";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const number = numberInput.value.trim();
      if (!number) return alert("Please enter your number!");

      output.innerHTML = "Generating pair code... ⏳";
      copyButton.style.display = "none";

      try {
        const res = await fetch("https://rodgers-md-backend-2.onrender.com/pair", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ number })
        });
        const data = await res.json();

        if (data.success) {
          latestPairCode = data.pairCode;
          output.innerHTML = `
            ✅ Pair Code: <b>${latestPairCode}</b><br>
            ✅ Session JSON sent to your WhatsApp!<br>
            <a href="https://whatsapp.com/channel/0029VbBR3ib3Ld1xQQlEG3vd1x" target="_blank">Visit Our Channel</a>
          `;
          copyButton.style.display = "inline-block";
        } else {
          output.innerHTML = `❌ Error: ${data.error}`;
        }

      } catch (err) {
        console.error(err);
        output.innerHTML = "❌ Failed to connect to backend!";
      }
    });

    copyButton.addEventListener("click", () => {
      if (!latestPairCode) return;
      navigator.clipboard.writeText(latestPairCode)
        .then(() => {
          alert("Pair code copied to clipboard ✅");
        })
        .catch(() => {
          alert("Failed to copy pair code ❌");
        });
    });
  </script>
</body>
</html>
