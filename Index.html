<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RODGERS MD Pair Site</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f5f5f5; }
    input, button { padding: 10px; margin: 10px; font-size: 16px; }
    footer { margin-top: 50px; font-size: 14px; color: #555; }
    a { color: #007bff; text-decoration: none; }
  </style>
</head>
<body>
  <h1>🔗 RODGERS MD Pair Site</h1>
  <p>Enter your WhatsApp number to generate a pair code:</p>
  <input type="text" id="number" placeholder="2547xxxxxxx" />
  <br />
  <button onclick="generatePairCode()">Generate Pair Code</button>
  <h2 id="pairCode"></h2>

  <script>
    function generatePairCode() {
      const number = document.getElementById('number').value.trim();
      if (!number) { alert('Enter your WhatsApp number!'); return; }
      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      document.getElementById('pairCode').textContent = `Your Pair Code: ${code}`;
      // TODO: Add backend to link WhatsApp and send JSON automatically
    }
  </script>

  <footer>
    <p>Powered by Rodgers</p>
    <p><a href="https://whatsapp.com/channel/0029VbBR3ib3LdQQlEG3vd1x" target="_blank">Visit our Channel</a></p>
  </footer>
</body>
</html>
